<header>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, width=device-width, user-scalable=no" />
        <meta name="color-scheme" content="light dark" />
    <script>(function(){try{var p=new URLSearchParams(location.search).get("theme");var t=(p==="dark"||p==="light")?p:sessionStorage.getItem("ielts_theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);sessionStorage.setItem("ielts_theme",t);}}catch(e){}})();</script>
    <link href="../styles.css" rel="stylesheet" />
</header>
