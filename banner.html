<!-- ════════════════════════════════════════════════════════════════════
     IELTS Practice Band 9 — Slim & Compact Web Banner
     Ultra-lightweight, Clean, High Conversion, Minimal Height (<76px)
     ════════════════════════════════════════════════════════════════════ -->
<meta charset="UTF-8">

<style>
    .ipo-app-banner {
        position: relative;
        max-width: 1040px;
        margin: 14px auto;
        padding: 8px 16px;
        box-sizing: border-box;
        border-radius: 14px;
        background-color: #08120e;
        background-image:
            radial-gradient(circle at 92% 30%, rgba(34, 199, 125, 0.18) 0%, transparent 45%),
            linear-gradient(135deg, #091511 0%, #0d2019 60%, #08120e 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        border: 1px solid rgba(34, 199, 125, 0.24);
        /* Apple-style specular top highlight + depth shadow */
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 24px -6px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        text-align: left;
        overflow: hidden;
    }

    /* Left Group: Mascot + Text */
    .ipo-banner-main {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1 1 auto;
    }

    /* Mascot Image */
    .ipo-mascot-wrap {
        position: relative;
        flex-shrink: 0;
        width: 86px;
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .ipo-mascot-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: bottom center;
    }

    /* Mascot cheer animation on banner hover */
    .ipo-app-banner:hover .ipo-mascot-wrap img {
        transform: scale(1.1) rotate(4deg);
    }

    /* Text Block */
    .ipo-text-wrap {
        min-width: 0;
    }

    .ipo-title {
        font-size: 15.5px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.3px;
        color: #ffffff;
        margin: 0 0 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ipo-gradient-text {
        background: linear-gradient(90deg, #34d399 0%, #38bdf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }



    .ipo-subtitle {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.35;
        color: #94a3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ipo-subtitle strong {
        color: #f1f5f9;
        font-weight: 600;
    }

    .ipo-star-rating {
        color: #fbbf24;
        font-size: 11px;
        margin-left: 3px;
    }

    .ipo-dot {
        color: rgba(255, 255, 255, 0.3);
        margin: 0 2px;
    }

    /* Right Action Button */
    .ipo-btn-wrap {
        flex-shrink: 0;
    }

    .ipo-app-download {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 16px;
        border-radius: 9px;
        background: #ffffff;
        color: #062319 !important;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none !important;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        white-space: nowrap;
        overflow: hidden;
    }

    /* Subtle Light Sweep (Shimmer) to attract eye naturally */
    .ipo-app-download::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 80%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
        transform: skewX(-20deg);
        animation: ipo-shimmer 4.8s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes ipo-shimmer {

        0%,
        75% {
            left: -120%;
        }

        100% {
            left: 160%;
        }
    }

    .ipo-app-download:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(34, 199, 125, 0.35);
        background: #f8fafc;
    }

    .ipo-app-download:active {
        transform: translateY(0);
    }

    .ipo-btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .ipo-btn-icon svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
    }

    .ipo-arrow-icon {
        width: 12px;
        height: 12px;
        transition: transform 0.15s ease;
    }

    .ipo-app-download:hover .ipo-arrow-icon {
        transform: translateX(2px);
    }

    /* Tablet & Mobile Responsive */
    @media (max-width: 680px) {
        .ipo-app-banner {
            margin: 12px 0;
            padding: 12px 14px;
            border-radius: 14px;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }

        .ipo-banner-main {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
        }

        .ipo-mascot-wrap {
            width: 56px;
            height: 46px;
            flex-shrink: 0;
        }

        .ipo-text-wrap {
            flex: 1 1 auto;
            min-width: 0;
        }

        .ipo-title {
            font-size: 13.5px;
            line-height: 1.25;
            white-space: normal;
            margin: 0 0 2px;
        }



        .ipo-subtitle {
            font-size: 11px;
            white-space: normal;
            line-height: 1.35;
        }

        .ipo-btn-wrap {
            width: 100%;
        }

        .ipo-app-download {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 14px;
            font-size: 13px;
            border-radius: 9px;
            gap: 6px;
            justify-content: center;
        }

        .ipo-btn-icon svg {
            width: 13px;
            height: 13px;
        }

        .ipo-arrow-icon {
            width: 12px;
            height: 12px;
        }
    }
</style>

<div class="ipo-app-banner">
    <!-- Left: Mascot & Info -->
    <div class="ipo-banner-main">
        <div class="ipo-mascot-wrap">
            <img src="https://app.ieltspracticeonline.com/app_images/mascot_band9.png"
                onerror="this.src='app_images/mascot_band9.png'" alt="IELTS Band 9 Mascot" width="86" height="66"
                loading="lazy">
        </div>

        <div class="ipo-text-wrap">
            <h3 class="ipo-title">
                Reach Band 9 with <span class="ipo-gradient-text">Daily AI Practice</span>
            </h3>
            <p class="ipo-subtitle">
                <span>Instant <strong>Speaking &amp; Writing</strong></span>
                <span class="ipo-sub-extra">evaluation</span>
                <span class="ipo-dot">&bull;</span>
                <span class="ipo-star-rating">4.8 &#9733;</span>
            </p>
        </div>
    </div>

    <!-- Right: Single CTA Button -->
    <div class="ipo-btn-wrap">
        <a href="#" id="ipo-app-download" class="ipo-app-download" target="_blank" rel="noopener noreferrer">
            <span id="ipo-btn-icon" class="ipo-btn-icon">
                <!-- Dynamic Platform Icon inserted via JS -->
                <svg viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
            </span>
            <span id="ipo-btn-label">Try IELTS App Free</span>
            <svg class="ipo-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </div>
</div>

<script>
    (function () {
        const playStore =
            "https://play.google.com/store/apps/details?id=com.lt.ieltspracticetest&referrer=utm_source%3Dieltspracticeonline%26utm_medium%3Dbanner%26utm_campaign%3Dapp_download";

        const appStore =
            "https://apps.apple.com/app/ielts-practice-band-9/id1487374890?utm_source=ieltspracticeonline&utm_medium=banner&utm_campaign=app_download";

        const desktopUrl = "https://app.ieltspracticeonline.com/";

        const button = document.getElementById("ipo-app-download");
        const label = document.getElementById("ipo-btn-label");
        const iconSpan = document.getElementById("ipo-btn-icon");
        if (!button) return;

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(ua);
        const isIOS =
            /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const isMobileScreen = window.innerWidth <= 600;

        // Platform SVG Icons
        const appleIcon = '<svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.09 1.73-.95 2.76.99.08 2.06-.51 2.68-1.26z"/></svg>';

        const googlePlayIcon = '<svg viewBox="0 0 24 24"><path d="M3.609 1.814L13.793 12 3.61 22.186c-.354-.258-.57-.678-.57-1.186V3c0-.508.216-.928.57-1.186zM15.207 13.414L5.053 23.568c.28.094.59.088.895-.084l11.137-6.425-1.878-3.645zm0-2.828L17.085 6.94 5.948.516c-.305-.172-.615-.178-.895-.084l10.154 10.154zm1.907 1.414l2.56-1.478c.883-.51.883-1.346 0-1.856l-2.56-1.478-1.507 2.406 1.507 2.406z"/></svg>';

        const lightningIcon = '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';

        // Customize button label, icon and destination based on device
        if (isAndroid) {
            button.href = playStore;
            if (iconSpan) iconSpan.innerHTML = googlePlayIcon;
            if (label) label.textContent = isMobileScreen ? "Get App" : "Get on Google Play";
        } else if (isIOS) {
            button.href = appStore;
            if (iconSpan) iconSpan.innerHTML = appleIcon;
            if (label) label.textContent = isMobileScreen ? "Get App" : "Get on App Store";
        } else {
            // Desktop: Opens web landing page
            button.href = desktopUrl;
            if (iconSpan) iconSpan.innerHTML = lightningIcon;
            if (label) label.textContent = "Try IELTS App Free";
        }

        button.addEventListener("click", function (e) {
            e.preventDefault();
            let targetUrl = desktopUrl;
            if (isAndroid) {
                targetUrl = playStore;
            } else if (isIOS) {
                targetUrl = appStore;
            }

            if (window.gtag) {
                window.gtag("event", "click_app_banner", {
                    event_category: "Conversion",
                    event_label: isAndroid ? "android" : isIOS ? "ios" : "desktop"
                });
            }

            window.open(targetUrl, "_blank", "noopener,noreferrer");
        });
    })();
</script>
